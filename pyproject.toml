[project]
name = "ava-mt5"
version = "0.1.0"
description = "Serveur MCP pour piloter un terminal MetaTrader 5 (AvaTrade) en compte démo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0,<3",
    "numpy>=1.26",
    "pandas>=2.0",
    "tzdata",
    "MetaTrader5>=5.0.45; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ava-mt5 = "ava_mt5.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ava_mt5"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
